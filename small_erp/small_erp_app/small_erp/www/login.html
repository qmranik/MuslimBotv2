<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Small ERP — Login</title>
    <link rel="stylesheet" href="/assets/small_erp/css/small-erp.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --success: #16a34a;
            --danger: #dc2626;
            --radius-sm: 6px;
            --radius-md: 10px;
            --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
            --shadow-md: 0 4px 6px -1px rgba(15,23,42,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(15,23,42,0.1);
            --font-body: 'Inter', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
        }
        .login-card {
            background: var(--bg-secondary);
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px 32px 32px;
        }
        .login-brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-brand .brand-icon {
            width: 48px; height: 48px;
            background: var(--accent);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 22px;
            margin-bottom: 12px;
        }
        .login-brand h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .login-brand p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: var(--font-body);
            background: white;
            transition: border-color 0.15s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            font-family: var(--font-body);
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            min-height: 44px;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .login-error.visible { display: block; }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .login-spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }
        .btn.loading .login-spinner { display: inline-block; }
        .btn.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <div class="brand-icon">L</div>
                <h1>Small ERP</h1>
                <p>Business Management Simplified</p>
            </div>

            <div id="login-error" class="login-error"></div>

            <form id="login-form" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="login-email">Username or Email</label>
                    <input type="text" class="form-control" id="login-email"
                           placeholder="e.g. Administrator" required autocomplete="username" autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" class="form-control" id="login-password"
                           placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span class="login-spinner"></span>
                    <span class="btn-text">Sign In</span>
                </button>
            </form>

            <div class="login-footer">
                Powered by ERPNext &mdash; &copy; 2026 DOS
            </div>
        </div>
    </div>

    <script>
        function showError(msg) {
            var el = document.getElementById('login-error');
            el.textContent = msg;
            el.classList.add('visible');
        }

        function hideError() {
            var el = document.getElementById('login-error');
            el.classList.remove('visible');
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideError();

            var email = document.getElementById('login-email').value.trim();
            var password = document.getElementById('login-password').value;
            var btn = document.getElementById('login-btn');

            if (!email || !password) {
                showError('Please enter both username and password.');
                return false;
            }

            btn.classList.add('loading');
            btn.disabled = true;

            try {
                var resp = await fetch('/api/method/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Accept': 'application/json',
                    },
                    body: 'usr=' + encodeURIComponent(email) + '&pwd=' + encodeURIComponent(password),
                });

                var contentType = resp.headers.get('Content-Type') || '';
                if (resp.redirected || (resp.ok && contentType.indexOf('application/json') === -1)) {
                    window.location.href = '/ops';
                    return false;
                }

                var data = await resp.json();

                if (data.message === 'Logged In' || data.home_page === '/ops' || (data.full_name && data.home_page)) {
                    window.location.href = (data.home_page && data.home_page !== '/app/home') ? data.home_page : '/ops';
                } else {
                    if (data._server_messages) {
                        try {
                            var msgs = JSON.parse(data._server_messages);
                            showError(msgs.map(function(m) {
                                try {
                                    return JSON.parse(m).message;
                                } catch(e) { return m; }
                            }).join(' '));
                        } catch(e) {
                            showError(data._server_messages);
                        }
                    } else if (data.message) {
                        showError(typeof data.message === 'string' ? data.message : 'Login failed. Please check your credentials.');
                    } else {
                        showError('Login failed. Please check your credentials.');
                    }
                }
            } catch(err) {
                showError('Unable to connect to the server. Please try again.');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }

            return false;
        }

        // Key down on password to submit
        document.getElementById('login-password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('login-form').dispatchEvent(new Event('submit'));
        });

        if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
</body>
</html>
