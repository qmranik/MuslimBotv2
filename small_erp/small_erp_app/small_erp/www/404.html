<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Page Not Found — Small ERP</title>
    <link rel="stylesheet" href="/assets/small_erp/css/small-erp.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --accent: #2563eb;
            --text-primary: #0f172a;
            --text-muted: #94a3b8;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .error-container { max-width: 420px; }
        .error-code {
            font-size: 80px;
            font-weight: 800;
            color: var(--accent);
            opacity: 0.15;
            line-height: 1;
            margin-bottom: -20px;
        }
        .error-icon {
            width: 72px; height: 72px;
            background: #dbeafe;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .error-icon i { width: 36px; height: 36px; color: var(--accent); }
        h1 { font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        p { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-body);
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary {
            background: white;
            color: var(--text-primary);
            border: 1px solid #e2e8f0;
        }
        .btn-secondary:hover { background: #f8fafc; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-icon">
            <i data-lucide="search-x"></i>
        </div>
        <h1>Page Not Found</h1>
        <p>The page you are looking for doesn't exist or has been moved.<br>Try navigating from the dashboard.</p>
        <div class="actions">
            <a href="/ops" class="btn btn-primary">
                <i data-lucide="layout-dashboard" style="width:16px;height:16px;"></i> Go to Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Go Back
            </a>
        </div>
    </div>
    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
</body>
</html>
