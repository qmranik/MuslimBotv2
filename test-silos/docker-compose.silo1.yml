services:
  mariadb:
    image: mariadb:10.11
    container_name: local-mariadb
    restart: unless-stopped
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    - --skip-character-set-client-handshake
    - --skip-innodb-read-only-compressed
    - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-512M}
    - --max-connections=150
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
    - mariadb-data-local:/var/lib/mysql
    networks:
    - smb-net-local
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
  redis-cache:
    image: redis:7-alpine
    container_name: local-redis-cache
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
    - smb-net-local
    deploy:
      resources:
        limits:
          memory: 192M
  frappe-web:
    image: frappe/erpnext:v15
    restart: unless-stopped
    env_file: .env
    environment:
    - DB_HOST=mariadb
    - DB_PORT=3306
    - REDIS_CACHE=redis://redis-cache:6379
    - REDIS_QUEUE=redis://redis-queue:6379
    - REDIS_SOCKETIO=redis://redis-cache:6379
    - SOCKETIO_PORT=9000
    - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    volumes:
    - ../small_erp/small_erp_app:/home/frappe/frappe-bench/apps/small_erp
    - ../small_erp/small_erp_app/small_erp/finish_setup.py:/home/frappe/frappe-bench/apps/small_erp/small_erp/finish_setup.py:ro
    - ../small_erp/small_erp_app/small_erp/seed_demo.py:/home/frappe/frappe-bench/apps/small_erp/small_erp/seed_demo.py:ro
    - ../small_erp/small_erp_app/small_erp/seed_orgs.py:/home/frappe/frappe-bench/apps/small_erp/small_erp/seed_orgs.py:ro
    - ../small_erp/small_erp_app/small_erp/seed_pharma.py:/home/frappe/frappe-bench/apps/small_erp/small_erp/seed_pharma.py:ro
    - frappe-sites-local:/home/frappe/frappe-bench/sites
    - frappe-logs-local:/home/frappe/frappe-bench/logs
    networks:
    - smb-net-local
    container_name: local-frappe-web
    command: '/home/frappe/frappe-bench/env/bin/gunicorn --chdir=/home/frappe/frappe-bench/sites
      --bind=0.0.0.0:8000 --workers=2 --threads=2 --worker-class=gthread --worker-tmp-dir=/dev/shm
      --timeout=120 --graceful-timeout=30 --reload frappe.app:application

      '
    ports:
    - ${FRAPPE_PORT:-8000}:8000
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1536M
  redis-queue:
    image: redis:7-alpine
    container_name: local-redis-queue
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --save 60 1000 --appendonly yes
    volumes:
    - redis-queue-data-local:/data
    networks:
    - smb-net-local
    deploy:
      resources:
        limits:
          memory: 128M
volumes:
  mariadb-data-local: null
  frappe-sites-local: null
  frappe-logs-local: null
  redis-queue-data-local: null
  n8n-data-local: null
  generative-ui-node-modules: null
  chatwoot-db-data-local: null
  chatwoot-storage-local: null
  muslimbot-kb-data-local: null
networks:
  smb-net-local:
    name: liteerp_smb-net-local
    driver: bridge
