# traefik/dynamic/authentik.yml
# ─────────────────────────────────────────────────────────────────
# ForwardAuth middleware configuration for Authentik.
#
# When a request hits a Traefik router with this middleware:
#   1. Traefik sends the request to the Authentik outpost endpoint
#   2. Authentik checks the .smb.localhost wildcard cookie
#   3. If valid: returns 200 + identity headers → Traefik passes to backend
#   4. If invalid: returns 401 → Traefik redirects to Authentik login
#
# The Go Orchestrator reads these forwarded headers in AuthentikMiddleware.
# ─────────────────────────────────────────────────────────────────

http:
  middlewares:
    authentik-forwardauth:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
