# docker-compose.extended.yml
# ─────────────────────────────────────────────────────────────────
# Platform Edge Layer: Authentik (IdP) + Traefik (Reverse Proxy)
#
# This compose file extends the base docker-compose.local.yml with:
#   1. platform-postgres  — Shared DB for Authentik + Go orchestrator
#   2. platform-redis     — Authentik session cache & token validation
#   3. authentik-server   — Identity Provider (OIDC, ForwardAuth)
#   4. authentik-worker   — Authentik background tasks
#   5. traefik            — Edge proxy with ForwardAuth middleware
#
# Auth Flow:
#   Browser → Traefik (:443) → ForwardAuth → Authentik validates cookie
#   → Traefik injects X-authentik-* headers → Go Orchestrator
#
# Usage:
#   docker compose -f docker-compose.local.yml -f docker-compose.extended.yml up -d
# ─────────────────────────────────────────────────────────────────

services:
  # ── State Layer ──────────────────────────────────────────────────

  platform-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: liteerp_admin
      POSTGRES_PASSWORD: ${DB_PASS:-changeme_in_production}
      POSTGRES_DB: authentik_db
    volumes:
      - platform_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liteerp_admin -d authentik_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net

  platform-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - platform_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net

  # ── Identity Provider (Authentik) ────────────────────────────────

  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: platform-redis
      AUTHENTIK_POSTGRESQL__HOST: platform-postgres
      AUTHENTIK_POSTGRESQL__USER: liteerp_admin
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      AUTHENTIK_POSTGRESQL__PASSWORD: ${DB_PASS:-changeme_in_production}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-this-to-a-long-random-string}
      # Disable Authentik's own error reporting
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    depends_on:
      platform-postgres:
        condition: service_healthy
      platform-redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Authentik Web UI / API
      - "traefik.http.routers.authentik.rule=Host(`auth.smb.localhost`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls=true"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
      # Authentik Outpost (ForwardAuth target)
      - "traefik.http.routers.authentik-outpost.rule=HostRegexp(`{host:.+}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.authentik-outpost.entrypoints=websecure"
      - "traefik.http.routers.authentik-outpost.tls=true"
      - "traefik.http.services.authentik-outpost.loadbalancer.server.port=9000"
    networks:
      - platform-net

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: platform-redis
      AUTHENTIK_POSTGRESQL__HOST: platform-postgres
      AUTHENTIK_POSTGRESQL__USER: liteerp_admin
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      AUTHENTIK_POSTGRESQL__PASSWORD: ${DB_PASS:-changeme_in_production}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-this-to-a-long-random-string}
    depends_on:
      platform-postgres:
        condition: service_healthy
      platform-redis:
        condition: service_healthy
    networks:
      - platform-net

  # ── Edge Proxy (Traefik) ─────────────────────────────────────────

  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      # API & Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=true"
      # Docker provider — auto-discover services via labels
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=platform-net"
      # File provider — for dynamic middleware config
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # TLS — auto-generate self-signed certs for .localhost domains
      - "--entrypoints.websecure.http.tls=true"
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
      - "8090:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - platform-net

  # ── Go Orchestrator ──────────────────────────────────────────────

  go-orchestrator:
    build:
      context: ./MuslimBot/go-orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "host=platform-postgres user=liteerp_admin password=${DB_PASS:-changeme_in_production} dbname=authentik_db port=5432 sslmode=disable"
      FRAPPE_URL: "http://frappe-web:8000"
      FRAPPE_SITE_HOST: "small.localhost"
      FRAPPE_API_KEY: ${FRAPPE_API_KEY:-}
      FRAPPE_API_SECRET: ${FRAPPE_API_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHATWOOT_URL: "http://chatwoot:3000"
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:-}
      NEXTCLOUD_URL: "https://files.smb.localhost"
      # Social scheduling = TryPost (MCP-native, replaces Postiz). See docs/architecture/ADR-0001.
      TRYPOST_URL: "https://social.smb.localhost"
      # TryPost MCP endpoint = <trypost>/mcp/trypost (bearer auth). Internal service URL:
      TRYPOST_MCP_URL: ${TRYPOST_MCP_URL:-http://trypost/mcp/trypost}
      TRYPOST_MCP_ENABLED: ${TRYPOST_MCP_ENABLED:-true}
      TRYPOST_API_TOKEN: ${TRYPOST_API_TOKEN:-}
      # Chatwoot agentic layer via fazer-ai/mcp-chatwoot (stdio subprocess; reuses CHATWOOT_URL + CHATWOOT_API_TOKEN).
      CHATWOOT_MCP_ENABLED: ${CHATWOOT_MCP_ENABLED:-true}
      AUTHENTIK_INTERNAL_URL: "http://authentik-server:9000"
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_LOCATION: ${GCP_LOCATION:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCP_RAG_CORPUS_ID: ${GCP_RAG_CORPUS_ID:-}
      REDIS_URL: ${REDIS_URL:-redis://redis-cache:6379/2}
    depends_on:
      platform-postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator.rule=Host(`api.smb.localhost`)"
      - "traefik.http.routers.orchestrator.entrypoints=websecure"
      - "traefik.http.routers.orchestrator.tls=true"
      - "traefik.http.routers.orchestrator.middlewares=authentik-forwardauth@file"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8080"
    networks:
      - platform-net
      - smb-net-local

  # ── Social Scheduling (TryPost — MCP-native, replaces Postiz) ─────
  # TryPost is a Laravel app (no official image). Vendor the source as a submodule:
  #   git submodule add https://github.com/trypostit/trypost vendor/trypost
  # then build. MCP endpoint is served by the app at /mcp/trypost (bearer auth).

  trypost-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trypost
      POSTGRES_USER: ${TRYPOST_DB_USER:-trypost}
      POSTGRES_PASSWORD: ${TRYPOST_DB_PASSWORD:?TRYPOST_DB_PASSWORD must be set}
    volumes:
      - trypost_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRYPOST_DB_USER:-trypost} -d trypost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net

  trypost:
    build:
      context: ./vendor/trypost
    image: muslimbot/trypost:local
    restart: unless-stopped
    environment: &trypost-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://social.smb.localhost
      APP_KEY: ${TRYPOST_APP_KEY:?TRYPOST_APP_KEY must be set (php artisan key:generate)}
      SELF_HOSTED: "true"
      DB_CONNECTION: pgsql
      DB_HOST: trypost-postgres
      DB_PORT: "5432"
      DB_DATABASE: trypost
      DB_USERNAME: ${TRYPOST_DB_USER:-trypost}
      DB_PASSWORD: ${TRYPOST_DB_PASSWORD:?TRYPOST_DB_PASSWORD must be set}
      REDIS_HOST: platform-redis
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
    volumes:
      - trypost_storage:/var/www/html/storage
    depends_on:
      trypost-postgres:
        condition: service_healthy
      platform-redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trypost.rule=Host(`social.smb.localhost`)"
      - "traefik.http.routers.trypost.entrypoints=websecure"
      - "traefik.http.routers.trypost.tls=true"
      # ERP-style: MCP/API paths must stay reachable without ForwardAuth (bearer-token clients).
      - "traefik.http.services.trypost.loadbalancer.server.port=80"
    networks:
      - platform-net

  trypost-horizon:
    image: muslimbot/trypost:local
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    environment: *trypost-env
    depends_on:
      trypost:
        condition: service_started
    networks:
      - platform-net

  trypost-scheduler:
    image: muslimbot/trypost:local
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    environment: *trypost-env
    depends_on:
      trypost:
        condition: service_started
    networks:
      - platform-net

volumes:
  platform_pg_data:
  platform_redis_data:
  authentik_media:
  authentik_templates:
  trypost_pg_data:
  trypost_storage:

networks:
  platform-net:
    driver: bridge
  smb-net-local:
    external: true
    name: liteerp_smb-net
