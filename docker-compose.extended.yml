# docker-compose.extended.yml
# ─────────────────────────────────────────────────────────────────
# Platform Edge Layer: Authentik (IdP) + Traefik (Reverse Proxy)
#
# This compose file extends the base docker-compose.local.yml with:
#   1. platform-postgres  — Shared DB for Authentik + Go orchestrator
#   2. platform-redis     — Authentik session cache & token validation
#   3. authentik-server   — Identity Provider (OIDC, ForwardAuth)
#   4. authentik-worker   — Authentik background tasks
#   5. traefik            — Edge proxy with ForwardAuth middleware
#
# Auth Flow:
#   Browser → Traefik (:443) → ForwardAuth → Authentik validates cookie
#   → Traefik injects X-authentik-* headers → Go Orchestrator
#
# Usage:
#   docker compose -f docker-compose.local.yml -f docker-compose.extended.yml up -d
# ─────────────────────────────────────────────────────────────────

services:
  # ── State Layer ──────────────────────────────────────────────────

  platform-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: liteerp_admin
      POSTGRES_PASSWORD: ${DB_PASS:-changeme_in_production}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: authentik_db
    volumes:
      - platform_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liteerp_admin -d authentik_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net

  platform-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - platform_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net

  # ── Identity Provider (Authentik) ────────────────────────────────

  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: platform-redis
      AUTHENTIK_POSTGRESQL__HOST: platform-postgres
      AUTHENTIK_POSTGRESQL__USER: liteerp_admin
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      AUTHENTIK_POSTGRESQL__PASSWORD: ${DB_PASS:-changeme_in_production}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-this-to-a-long-random-string}
      # Disable Authentik's own error reporting
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    depends_on:
      platform-postgres:
        condition: service_healthy
      platform-redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Authentik Web UI / API
      - "traefik.http.routers.authentik.rule=Host(`auth.${PUBLIC_DOMAIN:-smb.localhost}`)"
      - "traefik.http.routers.authentik.service=authentik"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls=true"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
      # Authentik Outpost (ForwardAuth target)
      - "traefik.http.routers.authentik-outpost.rule=HostRegexp(`{host:.+}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.authentik-outpost.service=authentik-outpost"
      - "traefik.http.routers.authentik-outpost.entrypoints=websecure"
      - "traefik.http.routers.authentik-outpost.tls=true"
      - "traefik.http.services.authentik-outpost.loadbalancer.server.port=9000"
    networks:
      - platform-net

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: platform-redis
      AUTHENTIK_POSTGRESQL__HOST: platform-postgres
      AUTHENTIK_POSTGRESQL__USER: liteerp_admin
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      AUTHENTIK_POSTGRESQL__PASSWORD: ${DB_PASS:-changeme_in_production}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-this-to-a-long-random-string}
    depends_on:
      platform-postgres:
        condition: service_healthy
      platform-redis:
        condition: service_healthy
    networks:
      - platform-net

  # ── Edge Proxy (Traefik) ─────────────────────────────────────────

  traefik:
    image: traefik:latest
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: 1.41
    command:
      # API & Dashboard (G5: insecure API disabled; dashboard is not published.
      # Expose it via a router behind authentik-auth@file if needed.)
      - "--api.dashboard=true"
      # Docker provider — auto-discover services via labels
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=muslimbot_platform-net"
      # File provider — for dynamic middleware config
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # TLS — auto-generate self-signed certs for .localhost domains
      - "--entrypoints.websecure.http.tls=true"
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      # Static IP so the orchestrator can trust ONLY Traefik as the forward-auth
      # source (G2). Nothing else on platform-net/smb-net-local shares this IP.
      platform-net:
        ipv4_address: 172.28.0.254

  # ── Go Orchestrator ──────────────────────────────────────────────

  go-orchestrator:
    build:
      context: ./go-orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      # ENV drives the production security floor (config.MustValidate). Leave as
      # "production" for any internet-facing deploy so trusted-proxy + secret
      # checks are enforced; set ENV=local only on a developer machine.
      ENV: ${ENV:-production}
      # G4: dev-only Administrator bypass. Never true in production (validator
      # refuses to boot if it is).
      AUTH_LOCAL_BYPASS: ${AUTH_LOCAL_BYPASS:-false}
      # G2: only Traefik's static platform-net IP may supply X-authentik-* headers.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.28.0.254/32}
      # P8: per-tenant cap on billable Gemini traffic.
      AI_RATE_LIMIT_PER_MIN: ${AI_RATE_LIMIT_PER_MIN:-30}
      AI_RATE_LIMIT_BURST: ${AI_RATE_LIMIT_BURST:-10}
      DATABASE_URL: "host=platform-postgres user=liteerp_admin password=${DB_PASS:-changeme_in_production} dbname=authentik_db port=5432 sslmode=disable"
      FRAPPE_URL: "http://frappe-web:8000"
      FRAPPE_SITE_HOST: "small.localhost"
      FRAPPE_API_KEY: ${FRAPPE_API_KEY:-}
      FRAPPE_API_SECRET: ${FRAPPE_API_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # G6/P5: real secrets required — the orchestrator's config.MustValidate
      # refuses to boot in production if these are empty or placeholders.
      ORCHESTRATOR_SERVICE_API_KEY: ${ORCHESTRATOR_SERVICE_API_KEY:-${KBBFF_API_KEY:?set ORCHESTRATOR_SERVICE_API_KEY or KBBFF_API_KEY}}
      WORKLOAD_JWT_SECRET: ${WORKLOAD_JWT_SECRET:-${ORCHESTRATOR_SERVICE_API_KEY:-${KBBFF_API_KEY:?set WORKLOAD_JWT_SECRET}}}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET (no placeholder)}
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-${LIVEKIT_URL:-ws://livekit:7880}}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-${LIVEKIT_URL:-}}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-muslimbot}
      CHATWOOT_URL: "http://chatwoot:3000"
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:-}
      NEXTCLOUD_URL: "https://files.smb.localhost"
      # Social scheduling = TryPost (MCP-native, replaces Postiz). See docs/architecture/ADR-0001.
      TRYPOST_URL: "https://social.smb.localhost"
      # TryPost MCP endpoint = <trypost>/mcp/trypost (bearer auth). Internal service URL:
      TRYPOST_MCP_URL: ${TRYPOST_MCP_URL:-http://trypost/mcp/trypost}
      TRYPOST_MCP_ENABLED: ${TRYPOST_MCP_ENABLED:-true}
      TRYPOST_API_TOKEN: ${TRYPOST_API_TOKEN:-}
      # Chatwoot agentic layer via fazer-ai/mcp-chatwoot (stdio subprocess; reuses CHATWOOT_URL + CHATWOOT_API_TOKEN).
      CHATWOOT_MCP_ENABLED: ${CHATWOOT_MCP_ENABLED:-true}
      AUTHENTIK_INTERNAL_URL: "http://authentik-server:9000"
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_LOCATION: ${GCP_LOCATION:-}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCP_RAG_CORPUS_ID: ${GCP_RAG_CORPUS_ID:-}
      REDIS_URL: ${REDIS_URL:-redis://redis-cache:6379/2}
    depends_on:
      platform-postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator.rule=Host(`api.${PUBLIC_DOMAIN:-smb.localhost}`)"
      - "traefik.http.routers.orchestrator.entrypoints=websecure"
      - "traefik.http.routers.orchestrator.tls=true"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8080"
    networks:
      - platform-net
      - smb-net-local

  # ── Social Scheduling (TryPost — MCP-native, replaces Postiz) ─────
  # TryPost is a Laravel app (no official image). Vendor the source as a submodule:
  #   git submodule add https://github.com/trypostit/trypost vendor/trypost
  # then build. MCP endpoint is served by the app at /mcp/trypost (bearer auth).

  trypost-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trypost
      POSTGRES_USER: ${TRYPOST_DB_USER:-trypost}
      POSTGRES_PASSWORD: ${TRYPOST_DB_PASSWORD:?TRYPOST_DB_PASSWORD must be set}
    volumes:
      - trypost_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRYPOST_DB_USER:-trypost} -d trypost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net

  trypost:
    build:
      context: ../vendor/trypost
      dockerfile: docker/Dockerfile
    image: muslimbot/trypost:local
    restart: unless-stopped
    environment: &trypost-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://social.smb.localhost
      APP_KEY: ${TRYPOST_APP_KEY:?TRYPOST_APP_KEY must be set (php artisan key:generate)}
      SELF_HOSTED: "true"
      DB_CONNECTION: pgsql
      DB_HOST: trypost-postgres
      DB_PORT: "5432"
      DB_DATABASE: trypost
      DB_USERNAME: ${TRYPOST_DB_USER:-trypost}
      DB_PASSWORD: ${TRYPOST_DB_PASSWORD:?TRYPOST_DB_PASSWORD must be set}
      REDIS_HOST: platform-redis
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
    volumes:
      - trypost_storage:/var/www/html/storage
    depends_on:
      trypost-postgres:
        condition: service_healthy
      platform-redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trypost.rule=Host(`social.${PUBLIC_DOMAIN:-smb.localhost}`)"
      - "traefik.http.routers.trypost.entrypoints=websecure"
      - "traefik.http.routers.trypost.tls=true"
      # ERP-style: MCP/API paths must stay reachable without ForwardAuth (bearer-token clients).
      - "traefik.http.services.trypost.loadbalancer.server.port=80"
      # Allow the GenUI pane to frame TryPost (see allow-embed on chatwoot).
      - "traefik.http.routers.trypost.middlewares=allow-embed"
    networks:
      - platform-net

  trypost-horizon:
    image: muslimbot/trypost:local
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    environment: *trypost-env
    depends_on:
      trypost:
        condition: service_started
    networks:
      - platform-net

  trypost-scheduler:
    image: muslimbot/trypost:local
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    environment: *trypost-env
    depends_on:
      trypost:
        condition: service_started
    networks:
      - platform-net

  # ── Core Services Edge Proxy Overrides ───────────────────────────
  frappe-web:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frappe.rule=Host(`erp.${PUBLIC_DOMAIN:-smb.localhost}`) || Host(`hrms.${PUBLIC_DOMAIN:-smb.localhost}`) || Host(`crm.${PUBLIC_DOMAIN:-smb.localhost}`)"
      - "traefik.http.routers.frappe.entrypoints=websecure"
      - "traefik.http.routers.frappe.tls=true"
      - "traefik.http.services.frappe.loadbalancer.server.port=8000"
    networks:
      - platform-net

  n8n:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${PUBLIC_DOMAIN:-smb.localhost}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      # Allow the GenUI pane to frame n8n (see allow-embed on chatwoot). n8n also needs
      # N8N_SECURE_COOKIE / frame settings — see plan §7.
      - "traefik.http.routers.n8n.middlewares=allow-embed"
    networks:
      - platform-net

  chatwoot-rails:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chatwoot.rule=Host(`chatwoot.${PUBLIC_DOMAIN:-smb.localhost}`)"
      - "traefik.http.routers.chatwoot.entrypoints=websecure"
      - "traefik.http.routers.chatwoot.tls=true"
      - "traefik.http.services.chatwoot.loadbalancer.server.port=3000"
      # allow-embed: let the GenUI pane (ui.<domain>) frame this app. Strips the app's
      # X-Frame-Options and pins frame-ancestors. NOTE: this REPLACES any CSP the app
      # sets — verify per app that no other CSP protection is lost (see plan §7).
      - "traefik.http.middlewares.allow-embed.headers.customresponseheaders.X-Frame-Options="
      - "traefik.http.middlewares.allow-embed.headers.contentsecuritypolicy=frame-ancestors 'self' https://ui.${PUBLIC_DOMAIN:-smb.localhost}"
      - "traefik.http.routers.chatwoot.middlewares=allow-embed"
    networks:
      - platform-net

  generative-ui:
    environment:
      # Point the pane at the orchestrator + Authentik. NEXT_PUBLIC_* are baked at
      # build time by Next — ensure they are present when the image is built, not only
      # at runtime (see plan §8).
      - "NEXT_PUBLIC_API_URL=https://api.${PUBLIC_DOMAIN:-smb.localhost}"
      - "NEXT_PUBLIC_AUTHENTIK_URL=https://auth.${PUBLIC_DOMAIN:-smb.localhost}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.genui.rule=Host(`ui.${PUBLIC_DOMAIN:-smb.localhost}`)"
      - "traefik.http.routers.genui.entrypoints=websecure"
      - "traefik.http.routers.genui.tls=true"
      # Port 3000 matches Dockerfile ENV PORT=3000 (Next.js standalone)
      - "traefik.http.services.genui.loadbalancer.server.port=3000"
    networks:
      - platform-net

  # ── Frappe / ERPNext ─────────────────────────────────────────────────────────
  # Override frappe-web to add Traefik labels for builder sub-domain.
  frappe-web:
    labels:
      - "traefik.enable=true"
      # Main ERP route (already defined in base compose — we add builder here)
      - "traefik.http.routers.frappe.rule=Host(`erp.${PUBLIC_DOMAIN:-smb.localhost}`)"
      - "traefik.http.routers.frappe.entrypoints=websecure"
      - "traefik.http.routers.frappe.tls=true"
      - "traefik.http.services.frappe.loadbalancer.server.port=8000"
      # Frappe Builder route
      - "traefik.http.routers.frappe-builder.rule=Host(`builder.${PUBLIC_DOMAIN:-smb.localhost}`)"
      - "traefik.http.routers.frappe-builder.entrypoints=websecure"
      - "traefik.http.routers.frappe-builder.tls=true"
      - "traefik.http.services.frappe-builder.loadbalancer.server.port=8000"
    networks:
      - platform-net

volumes:
  platform_pg_data:
  platform_redis_data:
  authentik_media:
  authentik_templates:
  trypost_pg_data:
  trypost_storage:

networks:
  platform-net:
    driver: bridge
    ipam:
      config:
        # Fixed subnet so Traefik can hold a stable static IP (172.28.0.2) that
        # the orchestrator trusts as its sole forward-auth source (G2).
        - subnet: 172.28.0.0/16
  smb-net-local:
    external: true
    name: liteerp_smb-net
