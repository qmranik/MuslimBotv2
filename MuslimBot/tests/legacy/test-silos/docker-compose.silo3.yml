# DEPRECATED: muslimbot-kb-bff removed; use go-orchestrator /v1/kb/*
services:
  redis-cache:
    image: redis:7-alpine
    container_name: local-redis-cache
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
    - smb-net-local
    deploy:
      resources:
        limits:
          memory: 192M
  muslimbot-kb-bff:
    build:
      context: ../Muslimbot-voice-agent
      dockerfile: Dockerfile
    image: muslimbot-voice-agent:latest
    container_name: local-muslimbot-kb-bff
    restart: unless-stopped
    command:
    - uvicorn
    - kb_bff.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8787'
    ports:
    - 8787:8787
    env_file: .env
    environment:
    - ERPNEXT_URL=http://frappe-web:8000
    - N8N_URL=http://n8n:5678
    - REDIS_URL=redis://redis-cache:6379/2
    - KB_DATA_DIR=/app/data
    - TENANT_ID=${TENANT_ID:-default}
    - KB_BFF_API_KEY=${KB_BFF_API_KEY:-change-me-in-production}
    - LIVEKIT_URL=${LIVEKIT_URL:-}
    - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
    - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    - LIVEKIT_AGENT_NAME=${LIVEKIT_AGENT_NAME:-muslimbot}
    - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    volumes:
    - muslimbot-kb-data-local:/app/data
    networks:
    - smb-net-local
    depends_on:
      redis-cache:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
volumes:
  mariadb-data-local: null
  frappe-sites-local: null
  frappe-logs-local: null
  redis-queue-data-local: null
  n8n-data-local: null
  generative-ui-node-modules: null
  chatwoot-db-data-local: null
  chatwoot-storage-local: null
  muslimbot-kb-data-local: null
networks:
  smb-net-local:
    name: liteerp_smb-net-local
    driver: bridge
