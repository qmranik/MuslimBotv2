##############################################################################
# Small ERP — GCP Budget Stack (e2-standard-4: 4 vCPU / 16 GB RAM)
#
# Optimized for $300 GCP credits — runs the core MuslimBot experience:
#   ✅ ERPNext + Small ERP (/ops)
#   ✅ Generative UI (React chat-to-dashboard)
#   ✅ n8n (AI workflows, webhooks)
#   ✅ Muslimbot KB BFF (Knowledge Hub RAG)
#   ✅ Muslimbot Voice Worker (optional, --profile voice)
#   ✅ Chatwoot (optional, --profile support)
#
# Excluded (saves ~6 GB RAM):
#   ❌ TryPost (social scheduling — MCP-native, replaces Postiz; not core to demo)
#   ❌ Authentik / Traefik / Go Orchestrator (platform edge)
#   NOTE: social = TryPost (trypostit/trypost); Chatwoot agentic layer =
#   fazer-ai/mcp-chatwoot (stdio). See docs/architecture/ADR-0001.
#
# Memory budget:
#   Core (always on):   ~7.5 GB
#   Chatwoot (optional): +3 GB
#   Voice (optional):    +0.5 GB
#   OS + Docker:         ~2 GB
#   Headroom:            ~3–6 GB
#
# Usage:
#   cp .env.template .env && docker build -t small-erp:latest .
#   docker compose -f docker-compose.gcp.yml up -d
#   bash small_erp/scripts/install-demo.sh
#   docker compose -f docker-compose.gcp.yml --profile voice up -d    # optional
#   docker compose -f docker-compose.gcp.yml --profile support up -d  # optional
##############################################################################

x-frappe-common: &frappe-common
  image: ${REGISTRY:-localhost}/small-erp:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    - DB_HOST=mariadb
    - DB_PORT=3306
    - REDIS_CACHE=redis://redis-cache:6379
    - REDIS_QUEUE=redis://redis-queue:6379
    - REDIS_SOCKETIO=redis://redis-socketio:6379
    - SOCKETIO_PORT=9000
    - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
  volumes:
    - frappe-sites:/home/frappe/frappe-bench/sites
    - frappe-logs:/home/frappe/frappe-bench/logs
  networks:
    - smb-net

x-chatwoot-common: &chatwoot-common
  image: chatwoot/chatwoot:v3.10.1
  restart: unless-stopped
  env_file: .env
  environment: &chatwoot-env
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
    POSTGRES_HOST: postgres-shared
    POSTGRES_USERNAME: chatwoot
    POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
    POSTGRES_DATABASE: chatwoot
    REDIS_URL: redis://shared-redis:6379/0
    SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY}
    FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
    ENABLE_ACCOUNT_SIGNUP: "false"
    FORCE_SSL: "false"
  volumes:
    - chatwoot-storage:/app/storage
  networks:
    - smb-net

services:
  # ─── MariaDB (Frappe / ERPNext) ───────────────────────────────────────
  # Reduced buffer pool for 16 GB VM
  mariadb:
    image: mariadb:10.11
    container_name: gcp-mariadb
    restart: unless-stopped
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--skip-character-set-client-handshake"
      - "--skip-innodb-read-only-compressed"
      - "--innodb-buffer-pool-size=768M"
      - "--innodb-log-file-size=64M"
      - "--innodb-flush-log-at-trx-commit=2"
      - "--innodb-flush-method=O_DIRECT"
      - "--max-connections=150"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - smb-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M

  # ─── Shared Postgres (Chatwoot only) ─────────────────────────────────
  postgres-shared:
    image: pgvector/pgvector:pg16
    container_name: gcp-postgres-shared
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SHARED_PASSWORD}
      POSTGRES_DB: postgres
      CHATWOOT_DB_PASSWORD: ${CHATWOOT_DB_PASSWORD}
    volumes:
      - postgres-shared-data:/var/lib/postgresql/data
      - ./configs/postgres/init-multidb.sh:/docker-entrypoint-initdb.d/10-init-multidb.sh:ro
    networks:
      - smb-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    profiles:
      - support
    deploy:
      resources:
        limits:
          memory: 768M

  # ─── Shared Redis (Chatwoot) ──────────────────────────────────────────
  shared-redis:
    image: redis:7-alpine
    container_name: gcp-shared-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - smb-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - support
    deploy:
      resources:
        limits:
          memory: 192M

  # ─── Redis Trio (Frappe) ──────────────────────────────────────────────
  redis-cache:
    image: redis:7-alpine
    container_name: gcp-redis-cache
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    networks:
      - smb-net
    deploy:
      resources:
        limits:
          memory: 192M

  redis-queue:
    image: redis:7-alpine
    container_name: gcp-redis-queue
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 64mb
      --save 60 1000
      --appendonly yes
    volumes:
      - redis-queue-data:/data
    networks:
      - smb-net
    deploy:
      resources:
        limits:
          memory: 128M

  redis-socketio:
    image: redis:7-alpine
    container_name: gcp-redis-socketio
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 32mb
      --save ""
      --appendonly no
    networks:
      - smb-net
    deploy:
      resources:
        limits:
          memory: 64M

  # ─── Frappe Web (reduced workers for 4 vCPU) ─────────────────────────
  frappe-web:
    <<: *frappe-common
    container_name: gcp-frappe-web
    command: >
      /home/frappe/frappe-bench/env/bin/gunicorn
      --chdir=/home/frappe/frappe-bench/sites
      --bind=0.0.0.0:8000
      --workers=2
      --threads=2
      --worker-class=gthread
      --worker-tmp-dir=/dev/shm
      --timeout=120
      --graceful-timeout=30
      --preload
      frappe.app:application
    ports:
      - "${FRAPPE_PORT:-8000}:8000"
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
      redis-socketio:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1024M

  # Single combined worker (handles default + short queues)
  frappe-worker-default:
    <<: *frappe-common
    container_name: gcp-frappe-worker-default
    command: bench worker --queue default,short,long
    depends_on:
      frappe-web:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  frappe-scheduler:
    <<: *frappe-common
    container_name: gcp-frappe-scheduler
    command: bench schedule
    depends_on:
      frappe-web:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M

  frappe-socketio:
    <<: *frappe-common
    container_name: gcp-frappe-socketio
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    depends_on:
      frappe-web:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 192M

  # ─── n8n — AI & Automation ────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:1.64.3
    container_name: gcp-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_PORT=5678
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - DB_TYPE=sqlite
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=72
      - GENERIC_TIMEZONE=${TZ:-UTC}
      - FRAPPE_URL=http://frappe-web:8000
      - FRAPPE_API_KEY=${FRAPPE_API_KEY}
      - FRAPPE_API_SECRET=${FRAPPE_API_SECRET}
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - smb-net
    depends_on:
      frappe-web:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Muslimbot KB BFF (Knowledge Hub API) ─────────────────────────────
  muslimbot-kb-bff:
    build:
      context: ./Muslimbot-voice-agent
      dockerfile: Dockerfile
    image: muslimbot-voice-agent:latest
    container_name: gcp-muslimbot-kb-bff
    restart: unless-stopped
    command: ["uvicorn", "kb_bff.main:app", "--host", "0.0.0.0", "--port", "8787"]
    ports:
      - "${KB_BFF_PORT:-8787}:8787"
    env_file: .env
    environment:
      - ERPNEXT_URL=http://frappe-web:8000
      - REDIS_URL=redis://redis-cache:6379/2
      - KB_DATA_DIR=/app/data
      - TENANT_ID=${TENANT_ID:-default}
      - KB_BFF_API_KEY=${KB_BFF_API_KEY:-change-me-in-production}
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - LIVEKIT_AGENT_NAME=${LIVEKIT_AGENT_NAME:-muslimbot}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Vertex AI RAG (optional — leave empty for SQLite fallback)
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GCS_KB_BUCKET=${GCS_KB_BUCKET:-}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
    volumes:
      - muslimbot-kb-data:/app/data
    depends_on:
      redis-cache:
        condition: service_started
    networks:
      - smb-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Generative UI (React SPA + nginx API proxy) ─────────────────────
  generative-ui:
    build:
      context: ./generative-ui
      dockerfile: Dockerfile
      args:
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-}
        VITE_LIVEKIT_URL: ${LIVEKIT_URL:-}
    image: ${REGISTRY:-localhost}/generative-ui:${IMAGE_TAG:-latest}
    container_name: gcp-generative-ui
    restart: unless-stopped
    ports:
      - "${GENERATIVE_UI_PORT:-5173}:80"
    environment:
      - FRAPPE_SITE_HOST=${FRAPPE_SITE_HOST:-${FRAPPE_SITE_NAME:-small.localhost}:8000}
      - FRAPPE_API_KEY=${FRAPPE_API_KEY}
      - FRAPPE_API_SECRET=${FRAPPE_API_SECRET}
      - KB_BFF_API_KEY=${KB_BFF_API_KEY:-change-me-in-production}
    depends_on:
      frappe-web:
        condition: service_started
      muslimbot-kb-bff:
        condition: service_started
    networks:
      - smb-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── Chatwoot (optional — profile: support) ──────────────────────────
  chatwoot-rails:
    <<: *chatwoot-common
    container_name: gcp-chatwoot
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "${CHATWOOT_PORT:-3000}:3000"
    depends_on:
      postgres-shared:
        condition: service_healthy
      shared-redis:
        condition: service_healthy
    profiles:
      - support
    deploy:
      resources:
        limits:
          memory: 1536M

  chatwoot-worker:
    <<: *chatwoot-common
    container_name: gcp-chatwoot-worker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      postgres-shared:
        condition: service_healthy
      shared-redis:
        condition: service_healthy
      chatwoot-rails:
        condition: service_started
    profiles:
      - support
    deploy:
      resources:
        limits:
          memory: 768M

  # ─── Muslimbot Voice Worker (optional — profile: voice) ──────────────
  muslimbot-voice-worker:
    build:
      context: ./Muslimbot-voice-agent
      dockerfile: Dockerfile
    image: muslimbot-voice-agent:latest
    container_name: gcp-muslimbot-voice
    restart: unless-stopped
    command: ["python", "agent.py", "start"]
    env_file: .env
    environment:
      - ERPNEXT_URL=http://frappe-web:8000
      - N8N_URL=http://n8n:5678
      - REDIS_URL=redis://redis-cache:6379/2
      - TENANT_ID=${TENANT_ID:-default}
      # Defaults to the self-hosted livekit service below; override in .env to
      # point at LiveKit Cloud instead.
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecretlocalonlychangeme0123456}
      - LIVEKIT_AGENT_NAME=${LIVEKIT_AGENT_NAME:-muslimbot}
    networks:
      - smb-net
    depends_on:
      frappe-web:
        condition: service_started
      n8n:
        condition: service_started
      livekit:
        condition: service_started
    profiles:
      - voice
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Self-hosted LiveKit server (WS-1 — profile: voice) ───────────────
  # use_external_ip is enabled in the GCP config; the RTP UDP range must be
  # open in the VPC firewall (WS-8) for media to reach remote callers.
  livekit:
    image: livekit/livekit-server:v1.8
    container_name: gcp-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit/livekit.yaml"]
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecretlocalonlychangeme0123456}"
    volumes:
      - ./configs/livekit/livekit.gcp.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    networks:
      - smb-net
    depends_on:
      livekit-redis:
        condition: service_started
    profiles:
      - voice
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── LiveKit Redis (shared by server + egress — WS-9, profile: voice) ─
  livekit-redis:
    image: redis:7-alpine
    container_name: gcp-livekit-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - smb-net
    profiles:
      - voice
    deploy:
      resources:
        limits:
          memory: 96M

  # ─── LiveKit Egress — call recording (WS-9, profile: voice) ───────────
  # RoomComposite audio-only → OGG. Uses headless Chrome (SYS_ADMIN). Storage
  # creds are passed per-request by the agent (GCS in prod), none configured here.
  egress:
    image: livekit/egress:latest
    container_name: gcp-livekit-egress
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: livekit-redis:6379
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-devsecretlocalonlychangeme0123456}
        ws_url: ws://livekit:7880
    cap_add:
      - SYS_ADMIN
    depends_on:
      livekit:
        condition: service_started
      livekit-redis:
        condition: service_started
    networks:
      - smb-net
    profiles:
      - voice
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  mariadb-data:
  postgres-shared-data:
  frappe-sites:
  frappe-logs:
  redis-queue-data:
  n8n-data:
  chatwoot-storage:
  muslimbot-kb-data:

networks:
  smb-net:
    name: liteerp_smb-net
    driver: bridge
