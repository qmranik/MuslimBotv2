version: '3.8'
services:
  muslimbot-voice-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: muslimbot-voice-agent:latest
    container_name: muslimbot_livekit_worker
    restart: unless-stopped
    command: ["python", "agent.py", "start"]
    env_file:
      - .env
    environment:
      GO_ORCHESTRATOR_URL: ${GO_ORCHESTRATOR_URL:-http://go-orchestrator:8080}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-muslimbot}
    networks:
      - smb-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  smb-net:
    external: true
    name: liteerp_smb-net
