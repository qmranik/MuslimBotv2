# traefik/dynamic/authentik.yml
# ─────────────────────────────────────────────────────────────────
# ForwardAuth middleware configuration for Authentik.
#
# When a request hits a Traefik router with this middleware:
#   1. Traefik sends the request to the Authentik outpost endpoint
#   2. Authentik checks the .smb.localhost wildcard cookie
#   3. If valid: returns 200 + identity headers → Traefik passes to backend
#   4. If invalid: returns 401 → Traefik redirects to Authentik login
#
# The Go Orchestrator reads these forwarded headers in AuthentikMiddleware.
# ─────────────────────────────────────────────────────────────────

http:
  middlewares:
    # Defense-in-depth for G2: blank any client-supplied X-authentik-* headers
    # BEFORE forward-auth runs, so a caller cannot smuggle a forged identity
    # through Traefik. Setting a customRequestHeader to "" removes it. The
    # forwardAuth step below re-injects the authentic values via
    # authResponseHeaders. Routers must use the `authentik-auth` chain (strip
    # THEN auth) — order is the whole point.
    strip-identity-headers:
      headers:
        customRequestHeaders:
          X-authentik-username: ""
          X-authentik-groups: ""
          X-authentik-email: ""
          X-authentik-name: ""
          X-authentik-uid: ""

    authentik-forwardauth:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid

    # Use this on protected routers instead of authentik-forwardauth directly.
    authentik-auth:
      chain:
        middlewares:
          - strip-identity-headers
          - authentik-forwardauth
